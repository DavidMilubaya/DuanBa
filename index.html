<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DuanBa</title>
    <style>
        /* --- 原有样式 --- */
        body {
            margin: 0;
            overflow: hidden;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            pointer-events: none;
            z-index: 10;
        }
        /* --- 新增：移动端控制按钮样式 --- */
        #joystick-area {
            position: absolute;
            bottom: 50px;
            left: 50px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.5);
            display: none; /* 默认隐藏，触屏设备显示 */
            touch-action: none;
            z-index: 20;
            user-select: none;
        }
        #joystick-knob {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,0.6);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none; /* 让触摸事件穿透到父容器 */
            transition: none;
        }
        /* 触摸设备显示摇杆 */
        @media (pointer: coarse) {
            #joystick-area {
                display: block;
            }

            #info {
                font-size: 14px;
                top: 10px;
                padding: 6px 12px;
            }
        }

    </style>
</head>
<body>
    <div id="info">🖱️ 拖拽旋转视角 | WASD 移动</div>
    <!-- 遥杆 -->
    <div id="joystick-area">
        <div id="joystick-knob"></div>
    </div>


    <!-- 配置 Three.js 导入映射 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module" src="main.js"></script>
</body>
</html>
